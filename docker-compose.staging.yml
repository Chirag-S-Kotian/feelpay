services:
  gateway:
    image: feelpay-gateway:staging
    build:
      context: .
      dockerfile: deploy/staging/gateway.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: staging
      PAYMENT_MODE: test
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?set staging DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set staging REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?set staging JWT_SECRET}
      MASTER_API_KEY: ${MASTER_API_KEY:?set staging MASTER_API_KEY}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?set staging VAULT_ENCRYPTION_KEY}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?set staging WEBHOOK_SIGNING_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set staging CORS_ALLOWED_ORIGINS}
      PAYMENT_LINK_BASE_URL: ${PAYMENT_LINK_BASE_URL:-}
      CHECKOUT_LINK_SIGNING_SECRET: ${CHECKOUT_LINK_SIGNING_SECRET:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin-server:
    image: feelpay-admin-server:staging
    build:
      context: .
      dockerfile: deploy/staging/admin-server.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: staging
      PAYMENT_MODE: test
      DATABASE_URL: ${DATABASE_URL:?set staging DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set staging JWT_SECRET}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?set staging VAULT_ENCRYPTION_KEY}
      ALLOW_SECRET_REVEAL: "false"
      ADMIN_CORS_ALLOWED_ORIGINS: ${ADMIN_CORS_ALLOWED_ORIGINS:?set staging ADMIN_CORS_ALLOWED_ORIGINS}
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8081
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  dashboard:
    image: feelpay-dashboard:staging
    build:
      context: .
      dockerfile: deploy/staging/dashboard.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL}
        VITE_SANDBOX_API_BASE_URL: ${VITE_SANDBOX_API_BASE_URL:-}
        VITE_LIVE_API_BASE_URL: ${VITE_LIVE_API_BASE_URL:-}
    restart: unless-stopped
    expose:
      - "8080"

  admin-frontend:
    image: feelpay-admin-frontend:staging
    build:
      context: .
      dockerfile: deploy/staging/admin-frontend.Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: ${VITE_ADMIN_API_BASE_URL:?set VITE_ADMIN_API_BASE_URL}
        VITE_DASHBOARD_BASE_URL: ${VITE_DASHBOARD_BASE_URL:?set VITE_DASHBOARD_BASE_URL}
        VITE_ADMIN_DEBUG_TOOLS: "false"
    restart: unless-stopped
    expose:
      - "8080"

  ingress:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      admin-server:
        condition: service_healthy
      dashboard:
        condition: service_started
      admin-frontend:
        condition: service_started
    ports:
      - "${STAGING_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
