services:
  postgres:
    image: postgres:15
    container_name: feelpay-local-postgres
    environment:
      POSTGRES_DB: feelpay_test
      POSTGRES_USER: feelpay
      POSTGRES_PASSWORD: feelpay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feelpay -d feelpay_test"]
      interval: 5s
      timeout: 5s
      retries: 20
