upstream gateway_upstream {
  server gateway:8080;
}

upstream admin_api_upstream {
  server admin-server:8081;
}

upstream dashboard_upstream {
  server dashboard:8080;
}

upstream admin_frontend_upstream {
  server admin-frontend:8080;
}

server {
  listen 8080;
  server_name dashboard-staging.example.com;

  location / {
    proxy_pass http://dashboard_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 8080;
  server_name admin-staging.example.com;

  location / {
    proxy_pass http://admin_frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 8080;
  server_name api-staging.example.com;

  location / {
    proxy_pass http://gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 8080;
  server_name admin-api-staging.example.com;

  location / {
    proxy_pass http://admin_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
