[package]
name = "feelpay"
version = "0.1.0"
edition = "2021"
description = "FeelPay - Payment Gateway Platform for India"
authors = ["FeelPay Team"]

[features]
default = []

[dependencies]
# Web framework
actix-web = "4"
actix-cors = "0.7"
actix-rt = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Password/Key hashing
argon2 = "0.5"

# JWT
jsonwebtoken = "9"

# HMAC for webhook signatures
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# HTTP client (for connector integrations)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# Validation
validator = { version = "0.19", features = ["derive"] }
# Random
rand = "0.8"

# Base64
base64 = "0.22"

# Async trait
async-trait = "0.1"

# Thiserror
thiserror = "2"

# CPU count
num_cpus = "1"
aes-gcm = "0.10.3"
zeroize = "1.8.2"
futures-util = "0.3.32"
regex = "1"
rust_decimal = { version = "1.41.0", features = ["db-postgres", "serde-float"] }
rust_decimal_macros = "1.40.0"
futures = "0.3.32"
totp-rs = { version = "5.7.1", features = ["qr"] }

# Lazy static for CAPTCHA store
lazy_static = "1.5"

[dev-dependencies]
actix-test = "0.1"
